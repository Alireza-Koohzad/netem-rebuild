[dataset]
name = "NetEM-Rebuild"
version = "1.0.0"
organism = "Homo sapiens"
taxon_id = 9606

[dataset.scope]
core_graph = true
disease_nodes = false
disease_profiles_separate = true

[disease_scope]
strategy = "focused"
target_disease_count_min = 2
target_disease_count_max = 4
status = "not_frozen"

[gene_universe]
catalog_scope = "all_approved_hgnc"
core_scope = "protein_coding"

required_locus_group = "protein-coding gene"
required_locus_type = "gene with protein product"

require_ensembl_gene_id = false
require_ncbi_gene_id = false

retain_non_core_genes_in_catalog = true

[node_types.gene]
enabled = true
canonical_namespace = "HGNC"
canonical_field = "hgnc_id"

[node_types.chemical]
enabled = true
canonical_namespace = "MESH"

[node_types.pathway]
enabled = true
canonical_namespace = "Reactome"

[node_types.tissue]
enabled = true
canonical_namespace = "UBERON"


[edge_types.gene_gene]
enabled = true
source_type = "gene"
target_type = "gene"
directed = false

[edge_types.chemical_gene]
enabled = true
source_type = "chemical"
target_type = "gene"
directed = true

[edge_types.gene_pathway]
enabled = true
source_type = "gene"
target_type = "pathway"
relation = "participates_in_pathway"
directed = true

[edge_types.gene_tissue]
enabled = true
source_type = "gene"
target_type = "tissue"
directed = true


[source_plan.hgnc]
role = "gene_identity_and_mapping"
status = "planned"

[source_plan.string]
role = "gene_gene"
status = "planned"

[source_plan.ctd]
role = "chemical_gene"
status = "planned"

[source_plan.reactome]
role = "gene_pathway"
status = "planned"

[source_plan.bgee]
role = "gene_tissue"
status = "planned"


[design]
allow_new_node_types = true
allow_new_edge_types = true
preserve_source_provenance = true
preserve_raw_source_attributes = true
keep_raw_data_immutable = true

[gene_gene_network]
source = "STRING"
network_type = "physical"
relation = "physically_associates_with"

primary_score_threshold = 400
sensitivity_score_thresholds = [700]

score_field = "combined_score"
score_scale = 1000

directed = false
remove_self_loops = true
collapse_reciprocal_edges = true

protein_to_gene_mapping = "identifier_reconciliation"
ambiguous_mapping_policy = "reject"

protein_pair_collapse = "best_combined_score"
preserve_support_count = true
preserve_channel_scores = true

[gene_gene_network.expected_build]
raw_unique_protein_pairs = 648245
gene_pairs_before_threshold = 633904
primary_edges = 422581
primary_active_genes = 17409
ambiguous_proteins = 2

[chemical_gene_network]
source = "CTD"
relation = "chemical_gene_interaction"

organism_id = 9606

chemical_namespace = "MESH"
gene_mapping = "NCBI_Gene_to_HGNC"

directed = true
canonical_direction = "chemical_to_gene"

binary_only = true
exclude_cotreatment = true
exclude_no_effect = true

preserve_interaction_actions = true
preserve_gene_forms = true
preserve_pubmed_ids = true

[chemical_gene_network.expected_build]
strict_curated_rows = 696222
chemicals = 9601
edges = 595993
active_core_genes = 18977
chemicals_without_cas = 4475


[edge_attributes.chemical_gene]
required_columns = [
    "source_id",
    "target_id",
    "relation",
    "supporting_curated_rows",
    "supporting_pubmed_count",
    "pubmed_ids",
    "interaction_actions",
    "gene_forms"
]


[gene_pathway_network]
source = "Reactome"
source_version = "97"

primary_mapping = "NCBI2Reactome"
crosscheck_mapping = "Ensembl2Reactome"

relation = "participates_in_pathway"

organism = "Homo sapiens"
taxon_id = 9606

mapping_identifier = "NCBI_Gene"
gene_mapping = "NCBI_Gene_to_HGNC"

pathway_namespace = "Reactome"
pathway_level = "lowest_level"

minimum_core_gene_count = 5
maximum_core_gene_count = 0

include_evidence_codes = ["TAS", "IEA"]
preserve_evidence_codes = true
preserve_support_count = true

include_disease_pathways = true
annotate_disease_pathways = true
disease_pathway_source = "HumanDiseasePathways.txt"

directed = true

[gene_pathway_network.sensitivity]
tas_only = true
target_disease_pathway_masking = true

[gene_pathway_network.expected_build]
pathways = 1633
disease_pathways = 185
edges = 47326
active_core_genes = 11191
core_gene_coverage_percent = 57.99
maximum_pathway_size = 477